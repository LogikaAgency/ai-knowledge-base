# ============================================================
# FONTI MANUALI (aggiungi direttamente in NotebookLM)
# ============================================================
# Non automatizzare queste — non ne vale la pena:
#
# TWITTER/X   → API ufficiale: $100/mese. Quando vedi un thread
#               interessante, copia l'URL e aggiungilo a mano.
#
# LINKEDIN    → No API pubblica. Stesso approccio: URL → manuale.
#
# PDF/PAPER   → Carica il file direttamente in NotebookLM,
#               oppure incolla l'URL (es. link ArXiv pubblico).
#
# REGOLA:     Automatizza le fonti regolari (newsletter, blog, YouTube).
#             Aggiungi a mano quello che trovi per caso.
#             10 secondi per aggiungere un URL > pagare API.
