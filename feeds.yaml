# ============================================================
# FONTI AUTOMATICHE — fetchate ogni settimana via cron
# ============================================================
# Modifica liberamente. Il sistema carica solo gli articoli
# nuovi grazie alla deduplicazione automatica su .seen_urls.json

notebook: "AI Weekly"
max_articles_per_feed: 5
lookback_days: 7

feeds:

  # ── AGGIORNAMENTI UFFICIALI ────────────────────────────────
  # Le release note dei modelli — roba che devi sapere per forza

  - url: https://openai.com/blog/rss.xml
    name: OpenAI Blog

  - url: https://www.anthropic.com/rss.xml
    name: Anthropic Blog

  - url: https://deepmind.google/blog/rss.xml
    name: Google DeepMind Blog

  - url: https://ai.meta.com/blog/rss/
    name: Meta AI Blog

  - url: https://huggingface.co/blog/feed.xml
    name: Hugging Face Blog

  - url: https://mistral.ai/news/rss/
    name: Mistral AI News


  # ── NEWSLETTER ─────────────────────────────────────────────
  # Già filtrate da qualcuno — alto rapporto segnale/rumore

  - url: https://tldr.tech/ai/rss
    name: TLDR AI
    # quotidiano, denso, ottimo per non perdere niente

  - url: https://www.bensbites.co/feed
    name: Ben's Bites
    # Substack, settimanale, buona copertura di tool e prodotti

  - url: https://jack-clark.net/feed/
    name: Import AI (Jack Clark)
    # settimanale, tecnico, paper + policy

  - url: https://www.deeplearning.ai/the-batch/rss/
    name: The Batch (Andrew Ng)
    # settimanale, equilibrato tra ricerca e applicazioni

  # Aggiungi altre newsletter Substack con:
  # https://nomeutente.substack.com/feed


  # ── TECH NEWS ──────────────────────────────────────────────

