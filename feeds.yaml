  - url: https://feeds.arstechnica.com/arstechnica/technology-lab
    name: Ars Technica Tech Lab

  - url: https://www.wired.com/feed/tag/ai/latest/rss
    name: Wired AI


  # ── YOUTUBE ────────────────────────────────────────────────
  # RSS nativo, niente API key — prende titolo + descrizione del video
  # Per i transcript: youtube-transcript-api (Python, gratuito)

  - url: https://www.youtube.com/feeds/videos.xml?channel_id=UCbmNph6atAoGfqLoCL_duAg
